[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/pretix-rs"

[workspace.dependencies]
pretix-webhook-events = { path = "crates/pretix-webhook-events", version = "0.3.0" }

axum = { version = "0.8.4", default-features = false }
base64 = "0.23.1"
bytes = "1.12"
http = "1.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.12"
tokio = { version = "1.49", default-features = false }
tower = "0.5.2"
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.19", features = ["fmt"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Line tables keep file and line in panics and backtraces, which is all a test
# failure needs; dropping full debuginfo shortens incremental test builds. For a
# debugger session, override for one build: `CARGO_PROFILE_DEV_DEBUG=2 cargo test ...`.
[profile.dev]
debug = "line-tables-only"

[workspace.metadata.release]
sign-commit = true
sign-tag = true
shared-version = true
tag-message = "Release {{version}}"
tag-name = "v{{version}}"
