[package]
name = "pretix-webhook-cli"
version.workspace = true
description = "Command-line pretix webhook receiver"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "pretix-webhook"
path = "src/main.rs"
doc = false

[dependencies]
pretix-webhook = { path = "../pretix-webhook", version = "0.3.0", features = ["tracing"] }
pretix-webhook-events = { workspace = true }

axum = { workspace = true, features = ["http1", "tokio"] }
clap = { version = "4.5.42", features = ["derive", "env"] }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
toml = "1.1.4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
temp-env = "0.3.6"
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
