[package]
name = "pretix-webhook"
version.workspace = true
description = "Tower service for receiving pretix webhooks"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["pretix", "webhook", "tower"]
categories = ["web-programming::http-server"]

[features]
default = []
tracing = ["dep:tracing"]
## Implement `schemars::JsonSchema` for `pretix-webhook-events` payload types.
schemars = ["pretix-webhook-events/schemars"]

[dependencies]
pretix-webhook-events = { workspace = true }

base64 = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body = "1.0.1"
http-body-util = "0.1.3"
serde_json = { workspace = true }
sha2 = "0.11.0"
subtle = "2.6.1"
tower = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
# Unconditional so the observability example in the crate docs compiles in
# every feature combination.
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }

[lints]
workspace = true
